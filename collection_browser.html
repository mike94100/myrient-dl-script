<!DOCTYPE html>
<html>
<head>
    <title>ROM Collection Browser</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        select, button { padding: 10px; margin: 5px; }
        .collection-info { display: none; margin: 20px 0; padding: 20px; border: 1px solid #ddd; }
        .filter-section { margin: 15px 0; }
        .file-container { display: flex; gap: 20px; margin: 10px 0; }
        .file-section { flex: 1; }
        .file-section h4 { margin: 0 0 10px 0; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .file-list { max-height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; }
        .file-item { padding: 2px 0; font-family: monospace; }
        .included { color: green; cursor: pointer; }
        .excluded { color: red; text-decoration: line-through; cursor: pointer; }
        .manually-included { color: darkgreen; font-weight: bold; }
        .manually-excluded { color: darkred; text-decoration: line-through; font-weight: bold; }
        .stats { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .loading { color: #666; font-style: italic; }
        .filter-groups-container { display: flex; gap: 20px; }
        .filter-groups-container .filter-group { flex: 1; }
        .filter-fields-container { margin: 5px 0; }
        .filter-field-row { display: flex; align-items: center; margin-bottom: 5px; }
        .filter-field-row input { flex: 1; padding: 5px; margin-right: 5px; }
        .filter-field-row button { padding: 5px 10px; background: #ff4444; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .filter-field-row button:hover { background: #cc0000; }
        .toggle-btn { padding: 2px 8px; background: #666; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 14px; margin-left: 10px; }
        .toggle-btn:hover { background: #444; }
        .filters-collapsed .filter-groups-container,
        .filters-collapsed .filter-group,
        .filters-collapsed .filter-buttons { display: none; }
        .filter-summary { background: #f9f9f9; padding: 8px; margin: 5px 0; border-left: 3px solid #666; font-size: 14px; }
    </style>
</head>
<body>
    <h1>ROM Collection Browser</h1>
    <p>Select a platform to view its ROM collection and download options.</p>

    <div>
        <label for="platform-select">Platform:</label>
        <select id="platform-select">
            <option value="">Choose a platform...</option>
        </select>
    </div>

    <div id="collection-info" class="collection-info">
        <h2 id="collection-title"></h2>
        <p id="collection-description"></p>

        <div class="filter-section">
            <h3>Filters <button id="toggle-filters" class="toggle-btn">&minus;</button></h3>

            <div class="filter-groups-container">
                <div class="filter-group">
                    <h4>Include Terms</h4>
                    <div id="include-filters-container" class="filter-fields-container">
                        <!-- Dynamic include filter fields will be added here -->
                    </div>
                    <small>Files must contain at least one of these terms</small>
                </div>

                <div class="filter-group">
                    <h4>Exclude Terms</h4>
                    <div id="exclude-filters-container" class="filter-fields-container">
                        <!-- Dynamic exclude filter fields will be added here -->
                    </div>
                    <small>Files containing any of these terms will be excluded</small>
                </div>
            </div>

            <div class="filter-group">
                <label>
                    <input type="checkbox" id="deduplicate" checked>
                    Enable deduplication
                </label>
            </div>

            <div class="filter-buttons">
                <button onclick="applyFilters()">Apply Filters</button>
                <button onclick="resetFilters()">Reset to Defaults</button>
            </div>
        </div>

        <div id="filter-info" class="filter-info">
            <!-- Filter summary will be displayed here -->
        </div>

        <div class="stats">
            <span id="stats-text">Loading...</span>
        </div>

        <div class="filter-section">
            <h3>Files</h3>
            <div class="file-container">
                <div class="file-section">
                    <h4>Included Files (0)</h4>
                    <div id="included-files" class="file-list"></div>
                </div>
                <div class="file-section">
                    <h4>Excluded Files (0)</h4>
                    <div id="excluded-files" class="file-list"></div>
                </div>
            </div>
        </div>

        <div class="filter-section">
            <button onclick="downloadBashScript()">Download Bash Script</button>
            <button onclick="downloadPythonScript()">Download Python Script</button>
        </div>
    </div>

    <script>
        let currentData = null;
        let filteredUrls = [];
        let bashTemplate = '';
        let pythonTemplate = '';
        let platformMetadata = {};
        let manualOverrides = new Set(); // Track manually toggled files

        const platformSelect = document.getElementById('platform-select');
        const collectionInfo = document.getElementById('collection-info');

        // Load metadata and templates on page load
        window.addEventListener('load', async () => {
            try {
                const [metadataResp, bashResp, pythonResp] = await Promise.all([
                    fetch('metadata.json'),
                    fetch('templates/bash_template.sh'),
                    fetch('templates/python_template.py')
                ]);

                platformMetadata = await metadataResp.json();
                bashTemplate = await bashResp.text();
                pythonTemplate = await pythonResp.text();

                // Populate platform select dropdown
                populatePlatformSelect();

                // Set up filter toggle functionality
                setupFilterToggle();
            } catch (error) {
                console.error('Failed to load resources:', error);
            }
        });

        function populatePlatformSelect() {
            const select = document.getElementById('platform-select');
            select.innerHTML = '<option value="">Choose a platform...</option>';

            // Sort by display name (Manufacturer - Console)
            const sortedPlatforms = Object.keys(platformMetadata.platforms)
                .map(platformKey => {
                    const platform = platformMetadata.platforms[platformKey];
                    return {
                        key: platformKey,
                        displayName: `${platform.manufacturer} - ${platform.console}`
                    };
                })
                .sort((a, b) => a.displayName.localeCompare(b.displayName));

            sortedPlatforms.forEach(platform => {
                const option = document.createElement('option');
                option.value = platform.key;
                option.textContent = platform.displayName;
                select.appendChild(option);
            });
        }

        platformSelect.addEventListener('change', async (e) => {
            const platform = e.target.value;
            if (!platform) {
                collectionInfo.style.display = 'none';
                // Clear manual overrides when changing platforms
                manualOverrides.clear();
                return;
            }

            document.getElementById('stats-text').textContent = 'Loading collection data...';
            collectionInfo.style.display = 'block';

            try {
                const response = await fetch(`data/${platform}.json`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                const metadata = platformMetadata.platforms[platform];
                currentData = {
                    platform: platform,
                    title: `${metadata.manufacturer} - ${metadata.console} ROM Collection`,
                    description: metadata.description,
                    files: data.files || data // Handle both new format with "files" and old format
                };
                displayCollection(currentData);
            } catch (error) {
                console.error('Failed to load collection:', error);
                document.getElementById('stats-text').textContent = 'Failed to load collection data. Check console for details.';
                document.getElementById('included-files').innerHTML = '<p>Error loading data</p>';
                document.getElementById('excluded-files').innerHTML = '<p>Error loading data</p>';
            }
        });

        function displayCollection(data) {
            document.getElementById('collection-title').textContent = data.title;
            document.getElementById('collection-description').textContent = data.description;

            // Initialize filter fields with default values
            initializeFilterFields('include-filters-container', ['(USA', '(World)', '(En']);
            initializeFilterFields('exclude-filters-container', ['(Beta', '(Demo', '(Proto', '(Sample', '(Kiosk', '[BIOS]', '(Unl', '[b]']);

            // Clear the filter-info section since we now use the collapsed summary
            const filterInfo = document.getElementById('filter-info');
            filterInfo.innerHTML = '';

            // Start with filters collapsed
            const filterSection = document.querySelector('.filter-section');
            filterSection.classList.add('filters-collapsed');
            const toggleBtn = document.getElementById('toggle-filters');
            toggleBtn.textContent = '+';
            addFilterSummary(filterSection);

            applyFilters();
        }

        function getFilterTerms() {
            // Get terms from dynamic filter fields
            const include = getFilterTermsFromFields('include-filters-container');
            const exclude = getFilterTermsFromFields('exclude-filters-container');
            const deduplicate = document.getElementById('deduplicate').checked;

            return {
                include: include,
                exclude: exclude,
                deduplicate: deduplicate
            };
        }

        function extractGameName(filename) {
            // Decode URL encoding first
            filename = decodeURIComponent(filename);

            // Remove extension and clean up filename for deduplication
            let name = filename.replace(/\.(zip|7z|rar)$/i, '');

            // Remove common ROM tags and version info
            name = name.replace(/\s*\([^)]*\)/g, ''); // Remove parentheses content
            name = name.replace(/\s*\[[^\]]*\]/g, ''); // Remove brackets content
            name = name.replace(/v\d+(\.\d+)?/gi, ''); // Remove version numbers
            name = name.replace(/rev\s*\d+/gi, ''); // Remove revision info
            name = name.replace(/\s+/g, ' ').trim(); // Normalize spaces

            return name.toLowerCase();
        }

        function deduplicateFiles(files) {
            const seen = new Set();
            return files.filter(file => {
                const gameName = extractGameName(file.url.split('/').pop());
                if (seen.has(gameName)) {
                    return false;
                }
                seen.add(gameName);
                return true;
            });
        }

        function applyFilters() {
            if (!currentData) return;

            let allFiles = currentData.files || currentData; // Handle both formats
            const filters = getFilterTerms();

            // Apply include/exclude filters first
            let filteredFiles = allFiles.filter(file => {
                const filename = decodeURIComponent(file.url.split('/').pop()).toLowerCase();

                // Check manual overrides first - these take precedence
                if (manualOverrides.has(file.url)) {
                    // If manually included, always include regardless of filters
                    return true;
                }

                // Check exclude patterns
                if (filters.exclude?.some(pattern => filename.includes(pattern.toLowerCase()))) {
                    return false;
                }

                // Check include patterns - if include terms exist, filename must contain at least one
                if (filters.include && filters.include.length > 0) {
                    return filters.include.some(term =>
                        filename.includes(term.toLowerCase())
                    );
                }

                return true;
            });

            // Apply deduplication if enabled
            if (filters.deduplicate) {
                filteredFiles = deduplicateFiles(filteredFiles);
            }

            // Extract URLs for script generation
            filteredUrls = filteredFiles.map(f => f.url);

            displayFiles(allFiles, filteredFiles);
        }

        function resetFilters() {
            // Reset filter fields to default values
            initializeFilterFields('include-filters-container', ['(USA', '(World)', '(En']);
            initializeFilterFields('exclude-filters-container', ['(Beta', '(Demo', '(Proto', '(Sample', '(Kiosk', '[BIOS]', '(Unl', '[b]']);
            document.getElementById('deduplicate').checked = true;
            // Clear manual overrides
            manualOverrides.clear();
            applyFilters();
        }

        function displayFiles(allFiles, filteredFiles) {
            const totalCount = allFiles.length;
            const filteredCount = filteredFiles.length;
            const excludedCount = totalCount - filteredCount;

            // Calculate sizes
            const totalCollectionSize = allFiles.reduce((sum, file) => sum + (file.size || 0), 0);
            const includedSize = filteredFiles.reduce((sum, file) => sum + (file.size || 0), 0);
            const formattedTotalSize = formatBytes(totalCollectionSize);
            const formattedIncludedSize = formatBytes(includedSize);

            // Update collection stats (before filtering)
            document.getElementById('stats-text').textContent =
                `ROM Collection: ${totalCount} files (${formattedTotalSize})`;

            // Update section headers with counts and sizes
            document.querySelector('.file-container .file-section:first-child h4').textContent =
                `Included Files (${filteredCount}, ${formattedIncludedSize})`;
            document.querySelector('.file-container .file-section:last-child h4').textContent =
                `Excluded Files (${excludedCount})`;

            // Populate included files
            const includedList = document.getElementById('included-files');
            let includedHtml = '';
            filteredFiles.forEach(file => {
                let filename = decodeURIComponent(file.url.split('/').pop());
                filename = filename.replace(/\.(zip|7z|rar)$/i, ''); // Remove file extension
                const isManuallyIncluded = manualOverrides.has(file.url);
                const classes = isManuallyIncluded ? 'file-item manually-included' : 'file-item included';
                includedHtml += `<div class="${classes}" onclick="toggleFileOverride('${file.url}')">${filename}</div>`;
            });
            includedList.innerHTML = includedHtml;

            // Populate excluded files
            const excludedList = document.getElementById('excluded-files');
            const excluded = allFiles.filter(file => !filteredFiles.some(f => f.url === file.url));
            let excludedHtml = '';
            excluded.forEach(file => {
                let filename = decodeURIComponent(file.url.split('/').pop());
                filename = filename.replace(/\.(zip|7z|rar)$/i, ''); // Remove file extension
                const isManuallyExcluded = manualOverrides.has(file.url);
                const classes = isManuallyExcluded ? 'file-item manually-excluded' : 'file-item excluded';
                excludedHtml += `<div class="${classes}" onclick="toggleFileOverride('${file.url}')">${filename}</div>`;
            });
            excludedList.innerHTML = excludedHtml;
        }

        function downloadBashScript() {
            if (!currentData || filteredUrls.length === 0 || !bashTemplate) {
                alert('No data loaded, no files to download, or template not loaded');
                return;
            }

            const platform = currentData.platform;

            // Create URL list variable
            let urlList = 'URLS=(\n';
            filteredUrls.forEach(url => {
                urlList += `    "${url}"\n`;
            });
            urlList += ')\n\n';

            // Single wget command with all URLs
            let fileDownloads = urlList + 'wget -np -c -e robots=off -R "index.html*" "${URLS[@]}"\n';

            let extraction = '';
            // Default: no extraction for most platforms
            // Could be extended to detect based on platform

            let script = bashTemplate
                .replace('{TITLE}', currentData.title)
                .replace('{DATE}', new Date().toISOString())
                .replace('{DIRECTORY}', `roms/${platform}`)
                .replace('{FILE_COUNT}', filteredUrls.length)
                .replace('{FILE_DOWNLOADS}', fileDownloads)
                .replace('{E_EXTRACTION}', extraction);

            downloadFile(script, `${platform}_download.sh`);
        }

        function downloadPythonScript() {
            if (!currentData || filteredUrls.length === 0 || !pythonTemplate) {
                alert('No data loaded, no files to download, or template not loaded');
                return;
            }

            const platform = currentData.platform;

            let urlList = '';
            filteredUrls.forEach(url => {
                urlList += `        "${url}",\n`;
            });

            let zipfileImport = '';
            let extraction = '';
            // Default: no extraction for most platforms
            // Could be extended to detect based on platform

            let script = pythonTemplate
                .replace('{TITLE}', currentData.title)
                .replace('{DATE}', new Date().toISOString())
                .replace('{DIRECTORY}', `roms/${platform}`)
                .replace('{URL_LIST}', urlList)
                .replace('{E_ZIPFILE}', zipfileImport)
                .replace('{E_EXTRACTION}', extraction);

            downloadFile(script, `${platform}_download.py`);
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB', 'EiB', 'ZiB', 'YiB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function downloadFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Dynamic filter field management
        function createFilterField(containerId, initialValue = '') {
            const container = document.getElementById(containerId);
            const fieldRow = document.createElement('div');
            fieldRow.className = 'filter-field-row';

            const input = document.createElement('input');
            input.type = 'text';
            input.value = initialValue;
            input.placeholder = 'Enter filter term...';

            const deleteBtn = document.createElement('button');
            deleteBtn.innerHTML = '&times;';
            deleteBtn.title = 'Remove filter';
            deleteBtn.onclick = () => removeFilterField(fieldRow, containerId);

            input.oninput = () => handleFilterInput(containerId);
            input.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleFilterInput(containerId);
                }
            };

            fieldRow.appendChild(input);
            fieldRow.appendChild(deleteBtn);
            container.appendChild(fieldRow);

            return fieldRow;
        }

        function removeFilterField(fieldRow, containerId) {
            const container = document.getElementById(containerId);
            container.removeChild(fieldRow);
            cleanupEmptyFields(containerId);
            applyFilters();
        }

        function handleFilterInput(containerId) {
            const container = document.getElementById(containerId);
            const inputs = container.querySelectorAll('input');
            const lastInput = inputs[inputs.length - 1];

            // If the last field has content and it's not empty, add a new empty field
            if (lastInput && lastInput.value.trim() !== '') {
                createFilterField(containerId);
            }

            // Clean up empty fields (but keep at least one)
            cleanupEmptyFields(containerId);

            // Apply filters when input changes
            applyFilters();
        }

        function cleanupEmptyFields(containerId) {
            const container = document.getElementById(containerId);
            const fieldRows = container.querySelectorAll('.filter-field-row');
            const inputs = Array.from(fieldRows).map(row => row.querySelector('input'));

            // Remove empty fields except the last one
            for (let i = inputs.length - 2; i >= 0; i--) {
                if (inputs[i].value.trim() === '') {
                    container.removeChild(fieldRows[i]);
                }
            }

            // Ensure there's always at least one empty field at the end
            const remainingInputs = container.querySelectorAll('input');
            const lastInput = remainingInputs[remainingInputs.length - 1];
            if (lastInput && lastInput.value.trim() !== '') {
                createFilterField(containerId);
            }
        }

        function initializeFilterFields(containerId, initialTerms) {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; // Clear existing fields

            if (initialTerms && initialTerms.length > 0) {
                initialTerms.forEach(term => createFilterField(containerId, term));
            }

            // Always add one empty field at the end
            createFilterField(containerId);
        }

        function getFilterTermsFromFields(containerId) {
            const container = document.getElementById(containerId);
            const inputs = container.querySelectorAll('input');
            return Array.from(inputs)
                .map(input => input.value.trim())
                .filter(value => value !== ''); // Remove empty values
        }

        // Filter toggle functionality
        function setupFilterToggle() {
            const toggleBtn = document.getElementById('toggle-filters');
            const filterSection = document.querySelector('.filter-section');

            toggleBtn.addEventListener('click', () => {
                const isCollapsed = filterSection.classList.contains('filters-collapsed');

                if (isCollapsed) {
                    // Expand filters
                    filterSection.classList.remove('filters-collapsed');
                    toggleBtn.innerHTML = '&minus;';
                    // Remove summary when expanding
                    const summary = document.getElementById('filter-summary');
                    if (summary) {
                        summary.remove();
                    }
                } else {
                    // Collapse filters
                    filterSection.classList.add('filters-collapsed');
                    toggleBtn.textContent = '+';
                    // Add compact summary
                    addFilterSummary(filterSection);
                }
            });
        }

        function addFilterSummary(filterSection) {
            const filters = getFilterTerms();

            // Remove any existing summary first (be extra sure)
            const existingSummary = document.getElementById('filter-summary');
            if (existingSummary) {
                existingSummary.remove();
            }

            // Create new summary with unique ID
            const summary = document.createElement('div');
            summary.id = 'filter-summary';
            summary.className = 'filter-summary';

            // Update summary content
            const includeText = filters.include.length > 0 ? filters.include.join(', ') : 'None';
            const excludeText = filters.exclude.length > 0 ? filters.exclude.join(', ') : 'None';
            const dedupText = filters.deduplicate ? 'Enabled' : 'Disabled';

            summary.innerHTML = `
                <strong>Include:</strong> ${includeText} |
                <strong>Exclude:</strong> ${excludeText} |
                <strong>Deduplication:</strong> ${dedupText}
            `;

            // Insert summary after the heading
            const heading = filterSection.querySelector('h3');
            heading.insertAdjacentElement('afterend', summary);
        }

        // Manual file override functionality
        function toggleFileOverride(fileUrl) {
            if (manualOverrides.has(fileUrl)) {
                manualOverrides.delete(fileUrl);
            } else {
                manualOverrides.add(fileUrl);
            }
            // Reapply filters to update the display
            applyFilters();
        }
    </script>
</body>
</html>
