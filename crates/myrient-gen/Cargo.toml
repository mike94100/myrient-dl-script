[package]
name = "myrient-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.11", features = ["json", "gzip", "rustls-tls", "blocking"] }
scraper = "0.14"
toml = "0.7"
clap = { version = "4.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.7"
anyhow = "1.0"
percent-encoding = "2.1"
regex = "1.7"
