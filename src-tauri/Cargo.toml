[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["Mike94100"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.9", features = [] }
tauri-plugin-log = "2.8"
dirs = "6.0"
tokio = { version = "1.49", features = ["process", "io-util"] }
reqwest = { version = "0.13", features = ["json", "gzip", "rustls", "stream"] }
scraper = "0.25"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.18"
md5 = "0.8"
toml = "0.9"
percent-encoding = "2.3"
